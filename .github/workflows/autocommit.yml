name: Daily Auto Commit

on:
  workflow_dispatch:      # Cho phép chạy thủ công
  schedule:
    - cron: '0 17 * * *'  # Tự động chạy mỗi ngày lúc 0h sáng Việt Nam (17h UTC)

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto commit
        run: |
          echo "Auto commit: $(date)" >> commit-log.txt
          git config user.name "tranquyk2"
          git config user.email "tranquyk2@users.noreply.github.com"
          git add .
          git commit -m "Auto commit: $(date)" || echo "No changes to commit"
          git push
