name: Daily 10 Auto Commits

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set git
        run: |
          git config user.name "tranquyk2"
          git config user.email "tranquyk2@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Create 10 commits instantly
        run: |
          for i in {1..10}; do
            echo "Commit $i at $(date)" >> commit-log.txt
            git add commit-log.txt
            git commit -m "Auto commit $i: $(date)"
          done

      - name: Push
        run: git push
